[target]
game = "firered"
revision = "rev1"
rom_path = "/mnt/t/Emulation/ROMs/Game Boy Advance/Pokemon - FireRed Version (USA, Europe) (Rev 1).gba"
# Defaults to true. Leave enabled for real runtime use so mismatched ROMs fail
# before launch.
# verify_hash = true
# Generate with `make syms GAME_VERSION=FIRERED GAME_REVISION=1` when the GBA
# toolchain is available.
# symbol_path = "pokefirered_rev1.sym"

[mgba]
executable = "mgba"
lua_bridge = "tools/runtime/emulators/mgba_bridge.lua"
host = "127.0.0.1"
port = 8766
windows_paths = false
connection_mode = "lua_server"
frame_advance_mode = "lua_run_frame"
# For Windows mGBA launched from WSL, use:
# windows_paths = true
# connection_mode = "lua_client"
# frame_advance_mode = "realtime_wait"
# script_cache_dir = "/mnt/t/Emulation/Emulators/mGBA-dev/pokemon-runtime-cache"
# log_file = "/mnt/t/Emulation/Emulators/mGBA-dev/pokemon-runtime-cache/mgba_bridge.log"

[runtime]
state_dir = ".runtime-state"
trace_dir = ".runtime-traces"
log_dir = ".runtime-logs"
screenshot_dir = ".runtime-screenshots"
cache_dir = ".runtime-cache"

[agent]
# Manual runtime operation does not require Codex credentials or an app-server.
mode = "disabled"
# Options: "fake" for deterministic local tests, "app_server" for the bounded
# screenshot-aware planner. Choose a current signed-in CLI context.
executable = "codex"
# model = "your-available-model"
# reasoning_effort = "medium"
